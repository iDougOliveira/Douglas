name: PokerCoach tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python tests
        run: python -m unittest -v
      - name: PokerVision syntax
        run: python -m py_compile pokervision/app.py pokervision/recognizer.py pokervision/templates_data.py pokervision/numeric_ocr.py
      - name: PokerVision template integrity
        run: |
          python - <<'PY'
          import base64, sys
          sys.path.insert(0, "pokervision")
          from templates_data import RANK_TEMPLATES_B64, SUIT_TEMPLATES_B64
          for name, bank, expected in (
              ("rank", RANK_TEMPLATES_B64, 128),
              ("suit", SUIT_TEMPLATES_B64, 98),
          ):
              for label, items in bank.items():
                  assert items, (name, label, "empty")
                  for item in items:
                      raw = base64.b64decode(item, validate=True)
                      assert len(raw) == expected, (name, label, len(raw), expected)
          print("PokerVision templates OK")
          PY
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: JavaScript selector smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("static/app.js").read_text()
          bad = []
          for line in s.splitlines():
              stripped = line.lstrip()
              if stripped.startswith("$(") and ".forEach" in stripped:
                  bad.append(stripped)
          assert not bad, f"Single-element selector used with forEach: {bad}"
          dollar = chr(36)
          assert dollar * 3 + "(" not in s, "Invalid triple-dollar selector helper found"
          print("Selector smoke OK")
          PY
      - name: Shell syntax
        run: bash -n bootstrap_github.sh auto_update.sh update.sh install.sh
