name: PokerCoach tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python tests
        run: python -m unittest -v
      - name: JavaScript syntax
        run: node --check static/app.js
